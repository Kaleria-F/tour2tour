services:
  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    ports:
      - "5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data

  trips-db:
    image: postgres:16
    environment:
      POSTGRES_DB: trips
      POSTGRES_USER: trips
      POSTGRES_PASSWORD: trips
    ports:
      - "5434:5432"
    volumes:
      - trips_db_data:/var/lib/postgresql/data

  rec-db:
    image: postgres:16
    environment:
      POSTGRES_DB: recs
      POSTGRES_USER: recs
      POSTGRES_PASSWORD: recs
    ports:
      - "5435:5432"
    volumes:
      - rec_db_data:/var/lib/postgresql/data

  payments-db:
    image: postgres:16
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5436:5432"
    volumes:
      - payments_db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  gateway:
    image: nginx:1.24
    ports:
      - "8888:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - auth-service
      - trips-service
      - recommendations-service
      - payments-service
      - documents-service

  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://auth:auth@auth-db:5432/auth
      JWT_SECRET: dev_secret
      JWT_ALG: HS256
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: ""
      SMTP_PORT: 587
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: ""
      SMTP_USE_TLS: "true"
      SMTP_USE_SSL: "false"
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - auth-db
      - redis

  trips-service:
    build:
      context: ../services/trips-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://trips:trips@trips-db:5432/trips
      JWT_SECRET: dev_secret
      JWT_ALG: HS256
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - trips-db

  recommendations-service:
    build:
      context: ../services/recommendations-service
      dockerfile: Dockerfile
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - rec-db
      - redis

  payments-service:
    build:
      context: ../services/payments-service
      dockerfile: Dockerfile
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - payments-db

  documents-service:
    build:
      context: ../services/documents-service
      dockerfile: Dockerfile
    environment:
      JWT_SECRET: dev_secret
      JWT_ALG: HS256
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: tour2tour-documents
      S3_USE_SSL: "false"
      S3_FORCE_PATH_STYLE: "true"
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - minio

volumes:
  auth_db_data:
  trips_db_data:
  rec_db_data:
  payments_db_data:
  minio_data:
