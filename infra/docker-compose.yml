services:
  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    ports:
      - "5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data

  trips-db:
    image: postgres:16
    environment:
      POSTGRES_DB: trips
      POSTGRES_USER: trips
      POSTGRES_PASSWORD: trips
    ports:
      - "5434:5432"
    volumes:
      - trips_db_data:/var/lib/postgresql/data

  rec-db:
    image: postgres:16
    environment:
      POSTGRES_DB: recs
      POSTGRES_USER: recs
      POSTGRES_PASSWORD: recs
    ports:
      - "5435:5432"
    volumes:
      - rec_db_data:/var/lib/postgresql/data

  places-db:
    image: postgres:16
    environment:
      POSTGRES_DB: places
      POSTGRES_USER: places
      POSTGRES_PASSWORD: places
    ports:
      - "5437:5432"
    volumes:
      - places_db_data:/var/lib/postgresql/data

  interactions-db:
    image: postgres:16
    environment:
      POSTGRES_DB: interactions
      POSTGRES_USER: interactions
      POSTGRES_PASSWORD: interactions
    ports:
      - "5438:5432"
    volumes:
      - interactions_db_data:/var/lib/postgresql/data

  payments-db:
    image: postgres:16
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5436:5432"
    volumes:
      - payments_db_data:/var/lib/postgresql/data

  documents-db:
    image: postgres:16
    environment:
      POSTGRES_DB: documents
      POSTGRES_USER: documents
      POSTGRES_PASSWORD: documents
    ports:
      - "5439:5432"
    volumes:
      - documents_db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  gateway:
    image: nginx:1.24
    ports:
      - "8888:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - auth-service
      - trips-service
      - recommendations-service
      - places-service
      - interactions-service
      - payments-service
      - documents-service

  admin-web:
    build:
      context: ../frontend/admin-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8888
        VITE_BASE_PATH: /
    ports:
      - "3001:80"
    restart: unless-stopped

  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://auth:auth@auth-db:5432/auth
      JWT_SECRET: dev_secret
      JWT_ALG: HS256
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: ""
      SMTP_PORT: 587
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: ""
      SMTP_USE_TLS: "true"
      SMTP_USE_SSL: "false"
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - auth-db
      - redis

  trips-service:
    build:
      context: ../services/trips-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://trips:trips@trips-db:5432/trips
      JWT_SECRET: dev_secret
      JWT_ALG: HS256
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      ORS_API_KEY: ${ORS_API_KEY:-}
      ORS_BASE_URL: ${ORS_BASE_URL:-https://api.openrouteservice.org/v2/directions}
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - trips-db

  recommendations-service:
    build:
      context: ../services/recommendations-service
      dockerfile: Dockerfile
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - rec-db
      - redis

  places-service:
    build:
      context: ../services/places-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://places:places@places-db:5432/places
      JWT_SECRET: dev_secret
      JWT_ALG: HS256
      PLACE_IMAGES_DIR: /app/place-images
      PLACE_IMAGES_BASE_URL: /media/places
      CITY_DATA_PATH: /app/data/russian_cities.json
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - places-db
    volumes:
      - place_images_data:/app/place-images

  interactions-service:
    build:
      context: ../services/interactions-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://interactions:interactions@interactions-db:5432/interactions
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - interactions-db

  payments-service:
    build:
      context: ../services/payments-service
      dockerfile: Dockerfile
    environment:
      JWT_SECRET: dev_secret
      JWT_ALG: HS256
      AUTH_SERVICE_URL: http://auth-service:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_API_BASE_URL: ${YOOKASSA_API_BASE_URL:-https://api.yookassa.ru/v3}
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-https://24tour2tour.ru/premium}
      PREMIUM_AMOUNT_RUB: ${PREMIUM_AMOUNT_RUB:-299.00}
      PREMIUM_DESCRIPTION: ${PREMIUM_DESCRIPTION:-Подписка Тур2Тур Pro}
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - payments-db

  documents-service:
    build:
      context: ../services/documents-service
      dockerfile: Dockerfile
    environment:
      JWT_SECRET: dev_secret
      JWT_ALG: HS256
      DATABASE_URL: postgresql+psycopg://documents:documents@documents-db:5432/documents
      S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.twcstorage.ru}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-https://s3.twcstorage.ru}
      S3_REGION: ${S3_REGION:-ru-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-tour2tour-test}
      S3_USE_SSL: ${S3_USE_SSL:-true}
      S3_VERIFY_SSL: ${S3_VERIFY_SSL:-true}
      S3_FORCE_PATH_STYLE: "true"
      S3_PRESIGN_TTL_SECONDS: 300
      S3_SSE_MODE: AES256
      S3_CORS_ALLOWED_ORIGINS: ${S3_CORS_ALLOWED_ORIGINS:-["http://localhost","http://127.0.0.1"]}
      MAX_UPLOAD_SIZE_BYTES: 15728640
      ENABLE_UPLOAD_SCAN: "false"
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - documents-db

volumes:
  auth_db_data:
  trips_db_data:
  rec_db_data:
  places_db_data:
  place_images_data:
  interactions_db_data:
  payments_db_data:
  documents_db_data:
