services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tour2tour
      POSTGRES_USER: tour2tour
      POSTGRES_PASSWORD: tour2tour
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  db_data: