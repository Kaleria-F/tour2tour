services:
  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  trips-db:
    image: postgres:16
    environment:
      POSTGRES_DB: trips
      POSTGRES_USER: trips
      POSTGRES_PASSWORD: ${TRIPS_DB_PASSWORD}
    volumes:
      - trips_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  rec-db:
    image: postgres:16
    environment:
      POSTGRES_DB: recs
      POSTGRES_USER: recs
      POSTGRES_PASSWORD: ${RECS_DB_PASSWORD}
    volumes:
      - rec_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  payments-db:
    image: postgres:16
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: ${PAYMENTS_DB_PASSWORD}
    volumes:
      - payments_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://auth:${AUTH_DB_PASSWORD}@auth-db:5432/auth
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALG: HS256
    ports:
      - "8001:8000"
    depends_on:
      - auth-db
    restart: unless-stopped

  trips-service:
    build:
      context: ../services/trips-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://trips:${TRIPS_DB_PASSWORD}@trips-db:5432/trips
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALG: HS256
    ports:
      - "8002:8000"
    depends_on:
      - trips-db
    restart: unless-stopped

  recommendations-service:
    build:
      context: ../services/recommendations-service
      dockerfile: Dockerfile
    ports:
      - "8003:8000"
    depends_on:
      - rec-db
      - redis
    restart: unless-stopped

  payments-service:
    build:
      context: ../services/payments-service
      dockerfile: Dockerfile
    ports:
      - "8004:8000"
    depends_on:
      - payments-db
    restart: unless-stopped

  documents-service:
    build:
      context: ../services/documents-service
      dockerfile: Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALG: HS256
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_USE_SSL: ${S3_USE_SSL}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
    ports:
      - "8005:8000"
    restart: unless-stopped

volumes:
  auth_db_data:
  trips_db_data:
  rec_db_data:
  payments_db_data:
