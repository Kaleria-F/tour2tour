services:
  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  trips-db:
    image: postgres:16
    environment:
      POSTGRES_DB: trips
      POSTGRES_USER: trips
      POSTGRES_PASSWORD: ${TRIPS_DB_PASSWORD}
    volumes:
      - trips_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  rec-db:
    image: postgres:16
    environment:
      POSTGRES_DB: recs
      POSTGRES_USER: recs
      POSTGRES_PASSWORD: ${RECS_DB_PASSWORD}
    volumes:
      - rec_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  places-db:
    image: postgres:16
    environment:
      POSTGRES_DB: places
      POSTGRES_USER: places
      POSTGRES_PASSWORD: ${PLACES_DB_PASSWORD}
    volumes:
      - places_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  interactions-db:
    image: postgres:16
    environment:
      POSTGRES_DB: interactions
      POSTGRES_USER: interactions
      POSTGRES_PASSWORD: ${INTERACTIONS_DB_PASSWORD}
    volumes:
      - interactions_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  payments-db:
    image: postgres:16
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: ${PAYMENTS_DB_PASSWORD}
    volumes:
      - payments_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  documents-db:
    image: postgres:16
    environment:
      POSTGRES_DB: documents
      POSTGRES_USER: documents
      POSTGRES_PASSWORD: ${DOCUMENTS_DB_PASSWORD}
    volumes:
      - documents_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://auth:${AUTH_DB_PASSWORD}@auth-db:5432/auth
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALG: HS256
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      SMTP_USE_SSL: ${SMTP_USE_SSL}
    ports:
      - "8001:8000"
    depends_on:
      - auth-db
      - redis
    restart: unless-stopped

  trips-service:
    build:
      context: ../services/trips-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://trips:${TRIPS_DB_PASSWORD}@trips-db:5432/trips
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALG: HS256
      YANDEX_API_KEY: ${YANDEX_API_KEY}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID}
      ORS_API_KEY: ${ORS_API_KEY}
      ORS_BASE_URL: ${ORS_BASE_URL:-https://api.openrouteservice.org/v2/directions}
    ports:
      - "8002:8000"
    depends_on:
      - trips-db
    restart: unless-stopped

  recommendations-service:
    build:
      context: ../services/recommendations-service
      dockerfile: Dockerfile
    ports:
      - "8003:8000"
    depends_on:
      - rec-db
      - redis
    restart: unless-stopped

  places-service:
    build:
      context: ../services/places-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://places:${PLACES_DB_PASSWORD}@places-db:5432/places
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALG: HS256
      PLACE_IMAGES_DIR: /app/place-images
      PLACE_IMAGES_BASE_URL: /media/places
      CITY_DATA_PATH: /app/data/russian_cities.json
    ports:
      - "8006:8000"
    depends_on:
      - places-db
    restart: unless-stopped
    volumes:
      - place_images_data:/app/place-images

  interactions-service:
    build:
      context: ../services/interactions-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://interactions:${INTERACTIONS_DB_PASSWORD}@interactions-db:5432/interactions
    ports:
      - "8007:8000"
    depends_on:
      - interactions-db
    restart: unless-stopped

  payments-service:
    build:
      context: ../services/payments-service
      dockerfile: Dockerfile
    ports:
      - "8004:8000"
    depends_on:
      - payments-db
    restart: unless-stopped

  documents-service:
    build:
      context: ../services/documents-service
      dockerfile: Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALG: HS256
      DATABASE_URL: postgresql+psycopg://documents:${DOCUMENTS_DB_PASSWORD}@documents-db:5432/documents
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_USE_SSL: ${S3_USE_SSL}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
      S3_PRESIGN_TTL_SECONDS: ${S3_PRESIGN_TTL_SECONDS:-300}
      S3_SSE_MODE: ${S3_SSE_MODE:-AES256}
      S3_CORS_ALLOWED_ORIGINS: ${S3_CORS_ALLOWED_ORIGINS}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-15728640}
      ENABLE_UPLOAD_SCAN: ${ENABLE_UPLOAD_SCAN:-false}
    ports:
      - "8005:8000"
    depends_on:
      - documents-db
    restart: unless-stopped

  admin-web:
    build:
      context: ../frontend/admin-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${ADMIN_WEB_API_BASE_URL:-https://api.24tour2tour.ru}
        VITE_BASE_PATH: ${ADMIN_WEB_BASE_PATH:-/admin/}
    ports:
      - "${ADMIN_WEB_PORT:-3001}:80"
    restart: unless-stopped

volumes:
  auth_db_data:
  trips_db_data:
  rec_db_data:
  places_db_data:
  place_images_data:
  interactions_db_data:
  payments_db_data:
  documents_db_data:
