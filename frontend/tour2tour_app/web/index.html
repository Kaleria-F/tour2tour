  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <script src="https://api-maps.yandex.ru/v3/?apikey=acf6e354-8f9c-4163-9d37-54bf33ee956b&lang=ru_RU"></script>
  <script>
    (function () {
      const API_KEY = 'acf6e354-8f9c-4163-9d37-54bf33ee956b';
      const CACHE_KEY = 't2t_yandex_geocode_cache_v1';
      const BUDGET_KEY = 't2t_yandex_geocode_budget_v1';
      const CACHE_TTL_MS = 30 * 24 * 60 * 60 * 1000; // 30 days
      const GEOCODER_DAILY_LIMIT = 1000;
      const RETRY_DELAYS_MS = [500, 1200, 2500];
      const fallbackCenter = [37.617635, 55.755814]; // Moscow fallback
      const mapState = new WeakMap();
      const retryState = new WeakMap();
      const syncQueue = new WeakMap();
      function resolveApiBaseUrl() {
        const host = (window.location && window.location.hostname) || '';
        if (host.endsWith('24tour2tour.ru')) return 'https://api.24tour2tour.ru';
        return 'http://127.0.0.1:8888';
      }

      async function ensureYmaps() {
        const maxAttempts = 60;
        let attempt = 0;
        while (!window.ymaps3 && attempt < maxAttempts) {
          await new Promise((resolve) => setTimeout(resolve, 100));
          attempt += 1;
        }
        if (!window.ymaps3) {
          throw new Error('ymaps3 is not loaded after waiting');
        }
        await window.ymaps3.ready;
        return window.ymaps3;
      }

      function readJson(key, fallbackValue) {
        try {
          const raw = window.localStorage.getItem(key);
          if (!raw) return fallbackValue;
          return JSON.parse(raw);
        } catch (_) {
          return fallbackValue;
        }
      }

      function writeJson(key, value) {
        try {
          window.localStorage.setItem(key, JSON.stringify(value));
        } catch (_) {}
      }

      function todayKey() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      function makeDailyLimitError() {
        const err = new Error('Daily geocoder limit reached');
        err.code = 'DAILY_LIMIT';
        return err;
      }

      function consumeGeocoderBudget() {
        const key = todayKey();
        const budget = readJson(BUDGET_KEY, { date: key, count: 0 });
        const current = budget && budget.date === key ? budget : { date: key, count: 0 };
        if ((current.count || 0) >= GEOCODER_DAILY_LIMIT) {
          throw makeDailyLimitError();
        }
        current.count = (current.count || 0) + 1;
        writeJson(BUDGET_KEY, current);
      }

      function normalizeQuery(value) {
        return String(value || '').replace(/\s+/g, ' ').trim().toLowerCase();
      }

      function getCachedCoordinates(query) {
        const norm = normalizeQuery(query);
        if (!norm) return null;
        const cache = readJson(CACHE_KEY, {});
        const row = cache[norm];
        if (!row || !Array.isArray(row.coords) || row.coords.length !== 2) {
          return null;
        }
        if (!row.ts || Date.now() - Number(row.ts) > CACHE_TTL_MS) {
          delete cache[norm];
          writeJson(CACHE_KEY, cache);
          return null;
        }
        return row.coords;
      }

      function setCachedCoordinates(query, coords) {
        const norm = normalizeQuery(query);
        if (!norm || !Array.isArray(coords) || coords.length !== 2) return;
        const cache = readJson(CACHE_KEY, {});
        cache[norm] = { coords: coords, ts: Date.now() };
        writeJson(CACHE_KEY, cache);
      }

      async function geocodeCity(city) {
        const query = String(city || '').trim();
        if (!query) return null;
        const cached = getCachedCoordinates(query);
        if (cached) return cached;

        consumeGeocoderBudget();
        const url =
          'https://geocode-maps.yandex.ru/v1/?apikey=' +
          encodeURIComponent(API_KEY) +
          '&format=json&results=1&lang=ru_RU&geocode=' +
          encodeURIComponent(query);

        const resp = await fetch(url);
        if (resp.status === 429) {
          throw makeDailyLimitError();
        }
        if (!resp.ok) {
          throw new Error('Geocoder request failed');
        }
        const data = await resp.json();
        const pos =
          data &&
          data.response &&
          data.response.GeoObjectCollection &&
          data.response.GeoObjectCollection.featureMember &&
          data.response.GeoObjectCollection.featureMember[0] &&
          data.response.GeoObjectCollection.featureMember[0].GeoObject &&
          data.response.GeoObjectCollection.featureMember[0].GeoObject.Point &&
          data.response.GeoObjectCollection.featureMember[0].GeoObject.Point.pos;

        if (!pos) return null;
        const parts = pos.split(' ');
        if (parts.length !== 2) return null;
        const lon = Number(parts[0]);
        const lat = Number(parts[1]);
        if (Number.isNaN(lon) || Number.isNaN(lat)) return null;
        const result = [lon, lat];
        setCachedCoordinates(query, result);
        return result;
      }

      function parseStagePoints(container) {
        try {
          const raw = container.getAttribute('data-stage-points') || '[]';
          const points = JSON.parse(raw);
          if (!Array.isArray(points)) return [];
          return points
            .map((point) => ({
              title: String((point && point.title) || '').trim(),
              address: String((point && point.address) || '').trim(),
              order: String((point && point.order) || '').trim(),
              time: String((point && point.time) || '').trim(),
              cost: String((point && point.cost) || '').trim(),
              notes: String((point && point.notes) || '').trim(),
            }))
            .filter((point) => normalizeQuery(point.address).length > 0);
        } catch (_) {
          return [];
        }
      }

      function clearMarkers(state) {
        if (!state || !state.map || !Array.isArray(state.markers)) return;
        state.markers.forEach((marker) => {
          try {
            state.map.removeChild(marker);
          } catch (_) {}
        });
        state.markers = [];
        state.selectedPointIndexes = [];
      }

      function clearRoute(state) {
        if (!state || !state.map || !state.routeFeature) return;
        try {
          state.map.removeChild(state.routeFeature);
        } catch (_) {}
        state.routeFeature = null;
      }

      function clearSelectedSuggestionMarker(state) {
        if (!state || !state.map || !state.selectedSuggestionMarker) return;
        try {
          state.map.removeChild(state.selectedSuggestionMarker);
        } catch (_) {}
        state.selectedSuggestionMarker = null;
      }

      function hideAddRouteButton(state) {
        if (!state || !state.addRouteButton) return;
        state.addRouteButton.style.display = 'none';
        state.addRouteButton.dataset.address = '';
      }

      function ensureAddRouteButton(state) {
        if (!state || !state.container) return null;
        if (state.addRouteButton) return state.addRouteButton;
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = 'Добавить в маршрут';
        button.style.position = 'absolute';
        button.style.right = '10px';
        button.style.bottom = '34px';
        button.style.zIndex = '7';
        button.style.display = 'none';
        button.style.pointerEvents = 'auto';
        button.style.border = '1px solid rgba(255,255,255,.24)';
        button.style.borderRadius = '999px';
        button.style.padding = '9px 14px';
        button.style.background = 'rgba(19,24,41,.92)';
        button.style.color = '#D7E37A';
        button.style.fontSize = '13px';
        button.style.fontWeight = '700';
        button.style.cursor = 'pointer';
        button.style.boxShadow = '0 6px 18px rgba(0,0,0,.28)';
        button.style.fontFamily =
          '"SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
        button.addEventListener('click', () => {
          const address = String(button.dataset.address || '').trim();
          if (!address) return;
          state.container.dispatchEvent(
            new CustomEvent('t2t-add-route-from-search', {
              detail: { address },
            }),
          );
        });
        state.container.appendChild(button);
        state.addRouteButton = button;
        return button;
      }

      function syncBottomControls(state) {
        if (!state || !state.container || !state.routePanel || !state.addRouteButton) return;
        const panel = state.routePanel;
        const button = state.addRouteButton;
        const bottom = parseFloat((panel.style.bottom || '34').replace('px', '')) || 34;
        const panelH = panel.offsetHeight || 0;
        const buttonH = button.offsetHeight || 0;
        const buttonBottom = Math.max(12, bottom + panelH - buttonH);
        button.style.bottom = `${buttonBottom}px`;
      }

      function showAddRouteButton(state, address) {
        const button = ensureAddRouteButton(state);
        if (!button) return;
        const cleanAddress = String(address || '').trim();
        if (!cleanAddress) {
          hideAddRouteButton(state);
          return;
        }
        button.dataset.address = cleanAddress;
        button.style.display = 'inline-flex';
        button.style.alignItems = 'center';
        syncBottomControls(state);
      }

      function createMarkerElement(options) {
        const isPrimary = Boolean(options && options.isPrimary);
        const isSelected = Boolean(options && options.isSelected);
        const label = String((options && options.label) || '').trim();
        const markerElement = document.createElement('div');
        markerElement.style.width = isPrimary ? '18px' : '24px';
        markerElement.style.height = isPrimary ? '18px' : '24px';
        markerElement.style.borderRadius = '50%';
        markerElement.style.background = isPrimary ? '#D7E37A' : '#7EA6FF';
        markerElement.style.border = isSelected ? '2px solid #ffffff' : '2px solid #151515';
        markerElement.style.boxShadow = isPrimary
          ? '0 0 0 4px rgba(215,227,122,.24)'
          : '0 0 0 3px rgba(126,166,255,.22)';
        markerElement.style.display = 'flex';
        markerElement.style.alignItems = 'center';
        markerElement.style.justifyContent = 'center';
        markerElement.style.fontSize = '12px';
        markerElement.style.fontWeight = '700';
        markerElement.style.color = '#0E1220';
        markerElement.style.fontFamily =
          '"SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
        if (label && !isPrimary) {
          markerElement.textContent = label;
        }
        return markerElement;
      }

      function updateMarkerSelectionVisual(state) {
        if (!state || !Array.isArray(state.markersMeta)) return;
        state.markersMeta.forEach((meta, index) => {
          if (!meta || !meta.element) return;
          const selected = (state.selectedPointIndexes || []).includes(index);
          meta.element.style.border = selected
            ? '2px solid #ffffff'
            : (meta.isPrimary ? '2px solid #151515' : '2px solid #151515');
          meta.element.style.boxShadow = selected
            ? '0 0 0 5px rgba(255,255,255,.2)'
            : (meta.isPrimary
                ? '0 0 0 4px rgba(215,227,122,.24)'
                : '0 0 0 3px rgba(126,166,255,.22)');
        });
      }

      function ensureRoutePanel(state) {
        if (!state || !state.container) return null;
        if (state.routePanel) return state.routePanel;
        const panel = document.createElement('div');
        panel.style.position = 'absolute';
        panel.style.left = '12px';
        panel.style.bottom = '34px';
        panel.style.zIndex = '7';
        panel.style.pointerEvents = 'auto';
        panel.style.padding = '10px 12px';
        panel.style.border = '1px solid rgba(255,255,255,.2)';
        panel.style.borderRadius = '16px';
        panel.style.background = 'rgba(19,24,41,.92)';
        panel.style.color = '#dfe6ff';
        panel.style.fontFamily = '"Geologica", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
        panel.style.fontSize = '13px';
        panel.style.width = 'max-content';
        panel.style.maxWidth = 'calc(100% - 176px)';

        const tabs = document.createElement('div');
        tabs.style.display = 'flex';
        tabs.style.gap = '6px';
        tabs.style.marginBottom = '6px';

        function mkBtn(icon, mode, title) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.innerHTML = icon;
          btn.title = title;
          btn.setAttribute('aria-label', title);
          btn.dataset.mode = mode;
          btn.style.border = '1px solid rgba(255,255,255,.24)';
          btn.style.borderRadius = '999px';
          btn.style.width = '46px';
          btn.style.height = '36px';
          btn.style.padding = '0';
          btn.style.background = 'transparent';
          btn.style.color = '#dfe6ff';
          btn.style.cursor = 'pointer';
          btn.style.fontSize = '18px';
          btn.style.display = 'inline-flex';
          btn.style.alignItems = 'center';
          btn.style.justifyContent = 'center';
          btn.style.fontFamily = '"Geologica", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
          btn.addEventListener('click', async () => {
            state.routeMode = mode;
            updateRouteModeVisual(state);
            await buildRouteIfReady(state);
          });
          return btn;
        }

        const iconCar =
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
          '<path d="M3.5 14.4V11.8c0-.8.5-1.5 1.3-1.7l2.2-.6 2-3.1c.3-.5.8-.8 1.4-.8h4.7c.6 0 1.1.3 1.4.8l2 3.1 2.2.6c.8.2 1.3.9 1.3 1.7v2.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>' +
          '<path d="M3.5 14.4h17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>' +
          '<circle cx="7" cy="15.8" r="1.8" fill="currentColor"/>' +
          '<circle cx="17" cy="15.8" r="1.8" fill="currentColor"/>' +
          '</svg>';
        const iconWalk =
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
          '<circle cx="12" cy="4.2" r="2.1" fill="currentColor"/>' +
          '<path d="M11 8.2l2.5 2.3 1.7 3.3M11 8.2l-2.4 2.5M11.4 11.1l-1.2 3.5-2.7 2.3M13.1 10.4l.2 4.2 2.8 3.2M10.9 14.1l2.5 1.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>' +
          '</svg>';
        const iconBike =
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
          '<circle cx="6.2" cy="17.2" r="3.2" stroke="currentColor" stroke-width="1.8"/>' +
          '<circle cx="18" cy="17.2" r="3.2" stroke="currentColor" stroke-width="1.8"/>' +
          '<path d="M10.1 17.2l3.1-5h3.2M9.2 9.2h3.4l2 3m-4-3 2.6 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>' +
          '</svg>';

        const btnCar = mkBtn(iconCar, 'driving-car', 'Авто');
        const btnWalk = mkBtn(iconWalk, 'foot-walking', 'Пешком');
        const btnBike = mkBtn(iconBike, 'cycling-regular', 'Вело');
        tabs.appendChild(btnCar);
        tabs.appendChild(btnWalk);
        tabs.appendChild(btnBike);

        const info = document.createElement('div');
        info.textContent = 'Выберите 2 точки на карте';
        info.style.color = 'rgba(223,230,255,.9)';
        info.style.fontFamily = '"Geologica", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
        info.style.fontSize = '13px';
        info.style.lineHeight = '1.2';

        panel.appendChild(tabs);
        panel.appendChild(info);
        state.container.appendChild(panel);
        state.routePanel = panel;
        state.routeInfo = info;
        state.routeModeButtons = [btnCar, btnWalk, btnBike];
        syncBottomControls(state);
        return panel;
      }

      function updateRouteModeVisual(state) {
        const mode = state.routeMode || 'driving-car';
        (state.routeModeButtons || []).forEach((btn) => {
          const selected = btn.dataset.mode === mode;
          btn.style.background = selected ? 'rgba(215,227,122,.18)' : 'transparent';
          btn.style.borderColor = selected ? '#d7e37a' : 'rgba(255,255,255,.24)';
          btn.style.color = '#d7e37a';
        });
      }

      function setRouteInfo(state, text) {
        if (state && state.routeInfo) {
          state.routeInfo.textContent = text;
        }
      }

      function ensureStageInfoCard(state) {
        if (!state || !state.container) return null;
        if (state.stageInfoCard) return state.stageInfoCard;
        const card = document.createElement('div');
        card.style.position = 'absolute';
        card.style.left = '12px';
        card.style.right = '12px';
        card.style.bottom = '8px';
        card.style.zIndex = '8';
        card.style.display = 'block';
        card.style.opacity = '0';
        card.style.transform = 'translateY(20px)';
        card.style.transition = 'opacity .18s ease, transform .18s ease';
        card.style.pointerEvents = 'auto';
        card.style.padding = '10px 12px';
        card.style.border = '1px solid rgba(255,255,255,.2)';
        card.style.borderRadius = '14px';
        card.style.background = 'rgba(19,24,41,.94)';
        card.style.color = '#e9eefc';
        card.style.fontFamily = '"Geologica", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
        card.style.fontSize = '13px';
        card.style.boxShadow = '0 8px 20px rgba(0,0,0,.3)';

        const header = document.createElement('div');
        header.style.display = 'flex';
        header.style.justifyContent = 'space-between';
        header.style.alignItems = 'center';
        header.style.marginBottom = '6px';

        const title = document.createElement('div');
        title.style.fontWeight = '700';
        title.style.fontSize = '15px';
        title.style.color = '#ffffff';
        title.textContent = 'Этап';

        const close = document.createElement('button');
        close.type = 'button';
        close.textContent = '✕';
        close.style.border = 'none';
        close.style.background = 'transparent';
        close.style.color = 'rgba(255,255,255,.82)';
        close.style.fontSize = '16px';
        close.style.cursor = 'pointer';
        close.addEventListener('click', () => hideStageInfo(state));

        header.appendChild(title);
        header.appendChild(close);

        const body = document.createElement('div');
        body.style.display = 'grid';
        body.style.gap = '3px';

        card.appendChild(header);
        card.appendChild(body);
        state.container.appendChild(card);
        state.stageInfoCard = card;
        state.stageInfoTitle = title;
        state.stageInfoBody = body;
        return card;
      }

      function hideStageInfo(state) {
        if (!state || !state.stageInfoCard) return;
        state.stageInfoCard.style.opacity = '0';
        state.stageInfoCard.style.transform = 'translateY(20px)';
        state.selectedStageInfo = null;
      }

      function showStageInfo(state, point) {
        if (!state || !point) return;
        ensureStageInfoCard(state);
        if (!state.stageInfoCard || !state.stageInfoBody || !state.stageInfoTitle) return;
        state.selectedStageInfo = point;
        state.stageInfoTitle.textContent = point.title || 'Этап';
        const lines = [];
        if (point.time) lines.push(`Время: ${point.time}`);
        if (point.cost) lines.push(`Стоимость: ${point.cost}`);
        if (point.address) lines.push(`Адрес: ${point.address}`);
        if (point.notes) lines.push(`Комментарий: ${point.notes}`);
        state.stageInfoBody.innerHTML = '';
        if (!lines.length) {
          const row = document.createElement('div');
          row.style.color = 'rgba(223,230,255,.84)';
          row.textContent = 'Нет дополнительных данных';
          state.stageInfoBody.appendChild(row);
        } else {
          lines.forEach((line) => {
            const row = document.createElement('div');
            row.style.color = 'rgba(223,230,255,.92)';
            row.style.lineHeight = '1.25';
            row.textContent = line;
            state.stageInfoBody.appendChild(row);
          });
        }
        state.stageInfoCard.style.opacity = '1';
        state.stageInfoCard.style.transform = 'translateY(0)';
      }

      function bindLongPress(element, callback) {
        let timer = null;
        const start = () => {
          clearTimeout(timer);
          timer = setTimeout(() => {
            timer = null;
            callback();
          }, 520);
        };
        const cancel = () => {
          if (timer) {
            clearTimeout(timer);
            timer = null;
          }
        };
        element.addEventListener('mousedown', start);
        element.addEventListener('touchstart', start, { passive: true });
        element.addEventListener('mouseup', cancel);
        element.addEventListener('mouseleave', cancel);
        element.addEventListener('touchend', cancel);
        element.addEventListener('touchcancel', cancel);
      }

      function formatDistance(meters) {
        if (meters >= 1000) return `${(meters / 1000).toFixed(1)} км`;
        return `${Math.round(meters)} м`;
      }

      function formatDuration(sec) {
        const mins = Math.round(sec / 60);
        if (mins < 60) return `${mins} мин`;
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        return m ? `${h} ч ${m} мин` : `${h} ч`;
      }

      async function buildRouteIfReady(state) {
        if (!state) return;
        clearRoute(state);
        const idxs = state.selectedPointIndexes || [];
        if (idxs.length !== 2) {
          setRouteInfo(state, 'Выберите 2 точки на карте');
          return;
        }
        const p1 = state.markersMeta[idxs[0]];
        const p2 = state.markersMeta[idxs[1]];
        if (!p1 || !p2 || !p1.coords || !p2.coords) return;
        setRouteInfo(state, 'Строим маршрут...');
        try {
          const mode = state.routeMode || 'driving-car';
          const resp = await fetch(`${resolveApiBaseUrl()}/trips/routing/ors/route`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              mode: mode,
              points: [
                { lon: p1.coords[0], lat: p1.coords[1] },
                { lon: p2.coords[0], lat: p2.coords[1] },
              ],
            }),
          });
          if (!resp.ok) {
            setRouteInfo(state, 'Маршрут недоступен');
            return;
          }
          const data = await resp.json();
          const geometry = data && data.geometry;
          const distance = data && data.distance_m;
          const duration = data && data.duration_s;
          if (!geometry || !Array.isArray(geometry.coordinates)) {
            setRouteInfo(state, 'Маршрут не найден');
            return;
          }
          const routeFeature = new window.ymaps3.YMapFeature({
            geometry: {
              type: 'LineString',
              coordinates: geometry.coordinates,
            },
            style: {
              stroke: [{ width: 5, color: 'rgba(114,172,255,0.95)' }],
            },
          });
          state.map.addChild(routeFeature);
          state.routeFeature = routeFeature;
          if (distance != null && duration != null) {
            setRouteInfo(
              state,
              `Маршрут: ${formatDuration(duration)} · ${formatDistance(distance)}`,
            );
          } else {
            setRouteInfo(state, 'Маршрут построен');
          }
        } catch (_) {
          setRouteInfo(state, 'Маршрут недоступен');
        }
      }

      function createSelectedSuggestionMarkerElement() {
        const markerElement = document.createElement('div');
        markerElement.style.width = '22px';
        markerElement.style.height = '22px';
        markerElement.style.borderRadius = '50%';
        markerElement.style.background = '#88e27e';
        markerElement.style.border = '2px solid #173117';
        markerElement.style.boxShadow = '0 0 0 4px rgba(136,226,126,.25)';
        return markerElement;
      }

      async function renderAddressSearchMarker(state, query, contextCity) {
        if (!state || !state.map) return;
        clearSelectedSuggestionMarker(state);
        const text = String(query || '').trim();
        const city = String(contextCity || '').trim();
        if (!text) {
          hideAddRouteButton(state);
          return;
        }
        const searchText =
          city && !text.toLowerCase().includes(city.toLowerCase())
            ? `${text}, ${city}`
            : text;
        const coords = await geocodeCity(searchText);
        if (!coords) {
          hideAddRouteButton(state);
          return;
        }
        const marker = new window.ymaps3.YMapMarker(
          { coordinates: coords },
          createSelectedSuggestionMarkerElement(),
        );
        state.map.addChild(marker);
        state.selectedSuggestionMarker = marker;
        showAddRouteButton(state, searchText);
        state.map.update({
          location: { center: coords, zoom: 15, duration: 220 },
        });
      }



      function averageCenter(points) {
        if (!points.length) return fallbackCenter;
        const sums = points.reduce(
          (acc, point) => {
            acc.lon += point.coords[0];
            acc.lat += point.coords[1];
            return acc;
          },
          { lon: 0, lat: 0 },
        );
        return [sums.lon / points.length, sums.lat / points.length];
      }

      function resetRetry(container) {
        retryState.delete(container);
      }

      function scheduleRetry(container) {
        const attempt = retryState.get(container) || 0;
        if (attempt >= RETRY_DELAYS_MS.length) return false;
        const delay = RETRY_DELAYS_MS[attempt];
        retryState.set(container, attempt + 1);
        window.setTimeout(() => {
          enqueueSync(container);
        }, delay);
        return true;
      }

      function renderPlaceholder(container, message, showRetryButton) {
        container.innerHTML =
          '<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#cfd7ef;font-size:14px;padding:0 12px;text-align:center;">' +
          `<div>${message}</div>` +
          (showRetryButton
            ? '<button data-map-retry style="border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#e7ebf5;border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;">Повторить</button>'
            : '') +
          '</div>';

        if (showRetryButton) {
          const button = container.querySelector('button[data-map-retry]');
          if (button) {
            button.addEventListener('click', () => {
              resetRetry(container);
              enqueueSync(container);
            });
          }
        }
      }

      async function renderCityMap(container, city, searchQuery, stagePoints) {
        if (!container) return;
        if (!container.isConnected) {
          throw new Error('Map container is not connected to DOM');
        }
        if (container.clientWidth <= 0 || container.clientHeight <= 0) {
          throw new Error('Map container has zero size');
        }
        const ymaps3 = await ensureYmaps();
        const focusQuery = String(city || '').trim();
        const searchText = String(searchQuery || '').trim();
        const points = [];
        let focusCoords = null;
        let orderCounter = 1;

        for (const point of stagePoints) {
          const coords = await geocodeCity(point.address);
          if (coords) {
            points.push({
              coords: coords,
              title: point.title || point.address,
              address: point.address || '',
              time: point.time || '',
              cost: point.cost || '',
              notes: point.notes || '',
              markerOrder: orderCounter,
              isPrimary: false,
            });
            orderCounter += 1;
          }
        }

        if (focusQuery) {
          focusCoords = await geocodeCity(focusQuery);
        }

        const { YMap, YMapDefaultSchemeLayer, YMapDefaultFeaturesLayer, YMapMarker } = ymaps3;

        if (!points.length && !focusCoords) {
          throw new Error('Address not found');
        }

        if (!YMap || !YMapDefaultSchemeLayer || !YMapDefaultFeaturesLayer || !YMapMarker) {
          throw new Error('Core Yandex Maps classes are unavailable');
        }
        let state = mapState.get(container);

        if (!state) {
          container.innerHTML = '';
          container.style.position = 'relative';
          const center = points.length ? averageCenter(points) : focusCoords;
          const map = new YMap(container, {
            location: { center: center, zoom: 11 },
          });
          map.addChild(new YMapDefaultSchemeLayer());
          map.addChild(new YMapDefaultFeaturesLayer());
          state = {
            map: map,
            container: container,
            markers: [],
            markersMeta: [],
            selectedSuggestionMarker: null,
            addRouteButton: null,
            routePanel: null,
            routeInfo: null,
            routeModeButtons: [],
            routeMode: 'driving-car',
            selectedPointIndexes: [],
            routeFeature: null,
          };
          mapState.set(container, state);
          ensureAddRouteButton(state);
          ensureRoutePanel(state);
          updateRouteModeVisual(state);
        }

        clearMarkers(state);
        clearSelectedSuggestionMarker(state);
        clearRoute(state);
        state.markersMeta = [];
        const center = points.length ? averageCenter(points) : focusCoords;
        const zoom = points.length > 1 ? 10 : 11;
        state.map.update({
          location: { center: center, zoom: zoom, duration: 300 },
        });

        points.forEach((point, pointIndex) => {
          const markerElement = createMarkerElement({
            isPrimary: point.isPrimary,
            label: point.isPrimary ? '' : String(point.markerOrder || ''),
          });
          markerElement.style.cursor = 'pointer';
          markerElement.addEventListener('click', async (ev) => {
            ev.stopPropagation();
            const arr = state.selectedPointIndexes || [];
            const existing = arr.indexOf(pointIndex);
            if (existing >= 0) {
              arr.splice(existing, 1);
            } else {
              if (arr.length >= 2) arr.shift();
              arr.push(pointIndex);
            }
            state.selectedPointIndexes = arr;
            updateMarkerSelectionVisual(state);
            await buildRouteIfReady(state);
          });
          bindLongPress(markerElement, () => {
            showStageInfo(state, point);
          });
          markerElement.title = point.title || '';
          const marker = new YMapMarker(
            { coordinates: point.coords },
            markerElement,
          );
          state.map.addChild(marker);
          state.markers.push(marker);
          state.markersMeta.push({
            isPrimary: point.isPrimary,
            element: markerElement,
            coords: point.coords,
            point: point,
          });
        });
        updateMarkerSelectionVisual(state);
        ensureRoutePanel(state);
        updateRouteModeVisual(state);
        setRouteInfo(state, 'Выберите 2 точки на карте');
        await renderAddressSearchMarker(state, searchText, city);
      }

      async function syncContainer(container) {
        if (!container || !container.classList || !container.classList.contains('t2t-yandex-city-map')) {
          return;
        }
        if (!container.isConnected) {
          return;
        }
        if (container.clientWidth <= 0 || container.clientHeight <= 0) {
          const willRetry = scheduleRetry(container);
          if (!willRetry) {
            renderPlaceholder(container, 'Карта временно недоступна', true);
          }
          return;
        }
        const city = (container.getAttribute('data-city') || '').trim();
        const searchQuery = (container.getAttribute('data-search-query') || '').trim();
        const stagePoints = parseStagePoints(container);
        if (!city && !stagePoints.length) {
          resetRetry(container);
          mapState.delete(container);
          renderPlaceholder(container, 'Нет адресов этапов для отображения', false);
          return;
        }
        try {
          await renderCityMap(container, city, searchQuery, stagePoints);
          resetRetry(container);
        } catch (error) {
          const errMessage =
            (error && error.message) ||
            (typeof error === 'string' ? error : null) ||
            'unknown error';
          console.error('Yandex map render failed:', errMessage, error);
          mapState.delete(container);
          if (error && error.code === 'DAILY_LIMIT') {
            resetRetry(container);
            renderPlaceholder(
              container,
              'Данный функционал пока недоступен, попробуйте завтра',
              false,
            );
            return;
          }
          if (error && error.message === 'Address not found') {
            resetRetry(container);
            renderPlaceholder(container, 'Адрес не найден', true);
            return;
          }
          if (error && error.message === 'Map container has zero size') {
            const willRetryOnSize = scheduleRetry(container);
            if (!willRetryOnSize) {
              renderPlaceholder(container, 'Карта временно недоступна', true);
            }
            return;
          }
          const willRetry = scheduleRetry(container);
          renderPlaceholder(
            container,
            willRetry ? 'Пробуем подключить карту...' : 'Карта временно недоступна',
            true,
          );
        }
      }

      function enqueueSync(container) {
        if (!container) return;
        const previous = syncQueue.get(container) || Promise.resolve();
        const next = previous
          .catch(() => {})
          .then(() => syncContainer(container))
          .catch(() => {});
        syncQueue.set(container, next);
      }

      const observer = new MutationObserver((mutations) => {
        for (const mutation of mutations) {
          if (mutation.type === 'attributes') {
            enqueueSync(mutation.target);
            continue;
          }
          if (mutation.type === 'childList') {
            mutation.addedNodes.forEach((node) => {
              if (!(node instanceof HTMLElement)) return;
              if (node.classList && node.classList.contains('t2t-yandex-city-map')) {
                enqueueSync(node);
              }
              if (node.querySelectorAll) {
                node
                  .querySelectorAll('.t2t-yandex-city-map')
                  .forEach((el) => enqueueSync(el));
              }
            });
          }
        }
      });

      document.addEventListener('DOMContentLoaded', () => {
        document
          .querySelectorAll('.t2t-yandex-city-map')
          .forEach((el) => enqueueSync(el));
      });

      document.addEventListener('t2t-city-change', (event) => {
        enqueueSync(event.target);
      });

      observer.observe(document.documentElement, {
        subtree: true,
        childList: true,
        attributes: true,
        attributeFilter: ['data-city', 'data-search-query', 'data-stage-points'],
      });

      window.t2tMap = { renderCityMap };
    })();
  </script>
